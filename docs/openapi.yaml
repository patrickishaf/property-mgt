  /leases/expiry/run:
    post:
      tags: [Leases]
      operationId: runLeaseExpiry
      summary: Run the lease expiry job (development only)
      description: Only registered when `APP_ENV=development`; no token required. Ends active leases whose end date has passed.
      responses:
        '200':
          description: Job ran (`message` is `expiry job ran`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ended]
                        properties:
                          ended:
                            type: integer
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from login, account creation, refresh or set password.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    InvalidRequest:
      description: '`invalid request` (body, query or path failed validation)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: invalid request
            data: null
    Unauthorized:
      description: '`invalid request` (missing/malformed Authorization header), `invalid token` or `invalid credentials`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: invalid token
            data: null
    Forbidden:
      description: '`invalid credentials` (the caller''s role may not perform this action)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PropertyNotFound:
      description: '`property not found` (does not exist or the caller cannot access it)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ManagerNotFound:
      description: '`manager not found` (does not exist or does not belong to the caller)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TenantNotFound:
      description: '`tenant not found` (does not exist or the caller cannot access it)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: '`something went wrong`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Envelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          description: Payload on success; null on error.

    ErrorEnvelope:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
          const: error
        message:
          type: string
        data:
          type: 'null'

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    OwnerAccount:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        accessToken:
          type: string
        refreshToken:
          type: string

    AdminUser:
      type: object
      description: All values are strings. `createdAt` uses Go's `time.String()` format in server-local time.
      required: [id, createdAt, email, firstName, lastName, phoneNumber, role]
      properties:
        id:
          type: string
          examples: ['6']
        createdAt:
          type: string
          examples: ['2026-10-31 13:35:59.123456 +0100 WAT']
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [owner, property_manager]

    TenantUser:
      type: object
      description: All values are strings, including amounts and IDs.
      required:
        - id
        - createdAt
        - email
        - expectedAnnualRent
        - firstName
        - lastName
        - leaseId
        - outstandingAnnualRent
        - phoneNumber
        - propertyId
        - unitNumber
      properties:
        id:
          type: string
        createdAt:
          type: string
        email:
          type: string
        expectedAnnualRent:
          type: string
          examples: ['1200']
        firstName:
          type: string
        lastName:
          type: string
        leaseId:
          type: string
        outstandingAnnualRent:
          type: string
        phoneNumber:
          type: string
        propertyId:
          type: string
        unitNumber:
          type: string

    Tenant:
      type: object
      required:
        - id
        - email
        - expectedRent
        - firstName
        - lastName
        - leaseId
        - outstandingRent
        - phoneNumber
        - propertyId
        - unitNumber
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        expectedRent:
          type: number
        firstName:
          type: string
        lastName:
          type: string
        leaseId:
          type: integer
        outstandingRent:
          type: number
        phoneNumber:
          type: string
        propertyId:
          type: integer
        unitNumber:
          type: string

    TenantList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateOwnerAccountRequest:
      type: object
      required: [email, fname, lname, password, phoneNumber]
      properties:
        email:
          type: string
          format: email
        fname:
          type: string
          minLength: 1
        lname:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        phoneNumber:
          type: string
          minLength: 1

    PasswordLoginRequest:
      type: object
      required: [email, password, accountType]
      properties:
        email:
          type: string
        password:
          type: string
        accountType:
          type: string
          enum: [tenant, admin]
          description: Owners and property managers use `admin`.

    RefreshTokenRequest:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Current access token; may be expired but must have a valid signature.
        refreshToken:
          type: string
          description: Unexpired refresh token for the same user.

    SetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The `token` query parameter from the invite link.
        password:
          type: string
          minLength: 8

    CreateLeaseRequest:
      type: object
      required: [startDate, endDate, durationType, expectedRent]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be after `startDate`.
        durationType:
          type: string
          enum: [annual, monthly]
        expectedRent:
          type: number
          exclusiveMinimum: 0
        allowPartialPayment:
          type: boolean
          default: false
        minimumPartialAmount:
          type: number
          minimum: 0
          description: Must not exceed `expectedRent`.

    CreateTenantRequest:
      type: object
      required: [email, firstName, lastName, phoneNumber, propertyId, unitNumber, lease]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        propertyId:
          type: integer
          minimum: 1
        unitNumber:
          type: string
          minLength: 1
          description: The `number` of an existing unit of the property, which must not have an active lease.
        lease:
          $ref: '#/components/schemas/CreateLeaseRequest'

    UpdateTenantRequest:
      type: object
      description: All fields optional; fields that are sent must be non-empty.
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1

    Property:
      type: object
      required:
        - id
        - activityStatus
        - archivedAt
        - city
        - country
        - location
        - managerId
        - name
        - numberOfOccupiedUnits
        - numberOfUnits
        - outstandingRent
        - ownerId
        - rentCollected
        - rentExpected
        - state
        - type
      properties:
        id:
          type: integer
        activityStatus:
          type: string
        archivedAt:
          type: [string, 'null']
          format: date-time
        city:
          type: string
        country:
          type: string
        location:
          type: string
        managerId:
          type: [integer, 'null']
        name:
          type: string
        numberOfOccupiedUnits:
          type: integer
        numberOfUnits:
          type: integer
        outstandingRent:
          type: number
          description: Sum of outstanding rent over active leases.
        ownerId:
          type: integer
        rentCollected:
          type: number
          description: Sum of amounts paid on active leases.
        rentExpected:
          type: number
          description: Sum of expected rent over active leases.
        state:
          type: string
        type:
          type: string

    PropertyList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Unit:
      type: object
      required: [id, floor, label, number, occupied]
      properties:
        id:
          type: integer
        floor:
          type: integer
        label:
          type: string
        number:
          type: string
        occupied:
          type: boolean
          description: Whether the unit has an active lease.

    Manager:
      type: object
      required: [id, email, firstName, lastName, phoneNumber, status]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
          enum: [invited, active]

    ManagerList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Manager'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateUnitRequest:
      type: object
      required: [number]
      properties:
        number:
          type: string
          minLength: 1
          description: Unique within the property.
        floor:
          type: integer
        label:
          type: string

    CreatePropertyRequest:
      type: object
      required: [name, type, city, state, country]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        activityStatus:
          type: string
        location:
          type: string
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        units:
          type: array
          description: Unit numbers must be unique within the request.
          items:
            $ref: '#/components/schemas/CreateUnitRequest'

    UpdatePropertyRequest:
      type: object
      description: All fields optional.
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        activityStatus:
          type: string
        location:
          type: string
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1

    AssignManagerRequest:
      type: object
      required: [managerId]
      properties:
        managerId:
          type: integer
          minimum: 1

    UpdateUnitRequest:
      type: object
      description: All fields optional.
      properties:
        floor:
          type: integer
        label:
          type: string

    CreateManagerRequest:
      type: object
      required: [email, firstName, lastName, phoneNumber]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1

    UpdateManagerRequest:
      type: object
      description: All fields optional; fields that are sent must be non-empty.
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1

    Payment:
      type: object
      required: [id, amount, createdAt, currency, leaseId, method, note, paidAt, propertyId, propertyName, purpose, recordedBy, reference, source, status, targetAmount, tenantFullName, tenantId, unitNumber]
      properties:
        id:
          type: integer
        amount:
          type: number
        checkoutUrl:
          type: string
          description: Checkout payments only.
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
          examples: [NGN]
        expiresAt:
          type: string
          format: date-time
          description: Checkout payments only.
        leaseId:
          type: integer
        method:
          type: string
          enum: [cash, bank_transfer, pos, cheque, other, checkout]
        note:
          type: string
        paidAt:
          type: [string, 'null']
          format: date-time
        propertyId:
          type: integer
        propertyName:
          type: string
        purpose:
          type: string
          enum: [lease, installments, partial]
        recordedBy:
          type: [integer, 'null']
        reference:
          type: string
        source:
          type: string
          enum: [offline, checkout]
        status:
          type: string
          enum: [unpaid, partially_paid, paid, failed, expired]
        targetAmount:
          type: number
        tenantFullName:
          type: string
        tenantId:
          type: integer
        unitNumber:
          type: string

    PaymentAllocation:
      type: object
      required: [amount, installmentId]
      properties:
        amount:
          type: number
        installmentId:
          type: [integer, 'null']
          description: Null when applied to a lease without installments.

    Receipt:
      type: object
      description: All values except `id` are strings.
      properties:
        id:
          type: integer
        amountPaid:
          type: string
        installmentAmount:
          type: string
        installmentAmountPaid:
          type: string
        installmentDueDate:
          type: string
        installmentStatus:
          type: string
        outstandingInstallmentAmount:
          type: string
        paymentDate:
          type: string
        paymentMethod:
          type: string
        previousPaymentAmount:
          type: string
        senderEmail:
          type: string
        senderFullName:
          type: string

    PaymentDetail:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [allocations, receipt]
          properties:
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/PaymentAllocation'
            receipt:
              oneOf:
                - $ref: '#/components/schemas/Receipt'
                - type: 'null'

    Installment:
      type: object
      required: [id, amountExpected, amountPaid, dueDate, lastPaymentDate, leaseId, outstandingAmount, overdue, propertyId, status, tenantId]
      properties:
        id:
          type: integer
        amountExpected:
          type: number
        amountPaid:
          type: number
        dueDate:
          type: string
          format: date
        lastPaymentDate:
          type: [string, 'null']
          format: date-time
        leaseId:
          type: integer
        outstandingAmount:
          type: number
        overdue:
          type: boolean
        propertyId:
          type: integer
        status:
          type: string
          enum: [unpaid, partially_paid, paid]
        tenantId:
          type: integer

    Lease:
      type: object
      required: [id, allowPartialPayment, amountPaid, durationType, endDate, endedAt, expectedRent, minimumPartialAmount, outstandingRent, propertyId, startDate, status, tenantId, unitNumber]
      properties:
        id:
          type: integer
        allowPartialPayment:
          type: boolean
        amountPaid:
          type: number
        durationType:
          type: string
          enum: [annual, monthly]
        endDate:
          type: string
          format: date
        endedAt:
          type: [string, 'null']
          format: date-time
        expectedRent:
          type: number
        minimumPartialAmount:
          type: number
        outstandingRent:
          type: number
        propertyId:
          type: integer
        startDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, ended, terminated]
        tenantId:
          type: integer
        unitNumber:
          type: string

    Portfolio:
      type: object
      required: [activeTenantCount, openInstallmentCount, outstandingRentBalance, overdueInstallmentCount, percentageRentCollected, totalOverdueAmount, totalRentCollected, totalRentExpected]
      properties:
        activeTenantCount:
          type: integer
        openInstallmentCount:
          type: integer
        outstandingRentBalance:
          type: number
        overdueInstallmentCount:
          type: integer
        percentageRentCollected:
          type: number
        totalOverdueAmount:
          type: number
        totalRentCollected:
          type: number
        totalRentExpected:
          type: number

    PaymentList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    InstallmentList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Installment'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreatePaymentRequest:
      type: object
      required: [leaseId, amount, method]
      properties:
        leaseId:
          type: integer
          minimum: 1
          description: Any status; ended and terminated leases can still be paid.
        amount:
          type: number
          exclusiveMinimum: 0
          description: Must not exceed the lease's outstanding rent.
        method:
          type: string
          enum: [cash, bank_transfer, pos, cheque, other]
        paidAt:
          type: string
          format: date
        reference:
          type: string
          description: Must be unique; generated if omitted.
        note:
          type: string
        installmentIds:
          type: array
          items:
            type: integer
            minimum: 1

    InitiateCheckoutRequest:
      type: object
      required: [type]
      properties:
        leaseId:
          type: integer
          minimum: 1
          description: One of the tenant's own leases. Defaults to the active lease, else the latest lease with a balance.
        type:
          type: string
          enum: [lease, installments, partial]
        installmentIds:
          type: array
          description: Required for `installments`.
          items:
            type: integer
            minimum: 1
        amount:
          type: number
          exclusiveMinimum: 0
          description: Required for `partial`; between the lease's minimum partial amount and its outstanding rent.

    SetInstallmentsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [amount, dueDate]
            properties:
              amount:
                type: number
                exclusiveMinimum: 0
              dueDate:
                type: string
                format: date

    UpdateInstallmentRequest:
      type: object
      required: [dueDate]
      properties:
        dueDate:
          type: string
          format: date

    UpdateLeaseRequest:
      type: object
      description: All fields optional.
      properties:
        allowPartialPayment:
          type: boolean
        minimumPartialAmount:
          type: number
          minimum: 0
          description: Must not exceed the lease's expected rent.
        endDate:
          type: string
          format: date
          description: Active leases only; must be after `startDate`.
        expectedRent:
          type: number
          exclusiveMinimum: 0
          description: Active leases with no unpaid installments; must be at least `amountPaid`.
        status:
          type: string
          enum: [ended, terminated]
          description: Active leases only. Frees the unit; the balance stays owed.

    LeaseDetail:
      allOf:
        - $ref: '#/components/schemas/Lease'
        - type: object
          required: [openInstallmentCount, overdueInstallmentCount, propertyName, tenantFullName]
          properties:
            openInstallmentCount:
              type: integer
            overdueInstallmentCount:
              type: integer
            propertyName:
              type: string
            tenantFullName:
              type: string

    LeaseList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lease'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateLeaseForTenantRequest:
      type: object
      required: [tenantId, propertyId, unitNumber, startDate, endDate, durationType, expectedRent]
      properties:
        tenantId:
          type: integer
          minimum: 1
        propertyId:
          type: integer
          minimum: 1
        unitNumber:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be after `startDate`.
        durationType:
          type: string
          enum: [annual, monthly]
        expectedRent:
          type: number
          exclusiveMinimum: 0
        allowPartialPayment:
          type: boolean
          default: false
        minimumPartialAmount:
          type: number
          minimum: 0
