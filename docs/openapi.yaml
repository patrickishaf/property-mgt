openapi: 3.1.0
info:
  title: Property Management API
  version: 0.1.0
  description: |
    Contract for the property management backend. The human-readable guide is `docs/API.md`.

    Every response uses the envelope `{status, message, data}`. On errors `data` is `null`
    and `message` is one of the documented messages.

    Keep this file and `docs/API.md` in sync with every API contract change.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
security: []
tags:
  - name: Auth
    description: Accounts, login and tokens
  - name: Tenants
    description: Tenant onboarding and management
  - name: Properties
    description: Properties, units and manager assignment
  - name: Managers
    description: Property manager accounts
  - name: Payments
    description: Payments and checkouts
  - name: Leases
    description: Leases, their lifecycle and installment schedules

paths:
  /auth/accounts:
    post:
      tags: [Auth]
      operationId: createOwnerAccount
      summary: Create an owner account
      description: Creates a property owner account and returns the user with access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerAccountRequest'
      responses:
        '200':
          description: Account created (`message` is `account created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OwnerAccount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: '`email already taken`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Logged in (`message` is `login successful`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: '`invalid credentials` (unknown email, wrong password, or invited tenant/manager without a password yet)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/user:
    get:
      tags: [Auth]
      operationId: getAuthenticatedUser
      summary: Get the logged-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's profile. Admins get an AdminUser, tenants a TenantUser.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/AdminUser'
                          - $ref: '#/components/schemas/TenantUser'
        '400':
          description: '`invalid request` (token carries an unrecognised role)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`record not found in the db` (the user no longer exists)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/token/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthToken
      summary: Get a new access token
      description: |
        Exchanges an unexpired refresh token, plus the same user's current (possibly expired)
        access token, for a new access token. The refresh token is not rotated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token (`message` is `token refreshed`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: |
            `invalid token` (bad or wrong-type token, expired refresh token, or tokens for different users),
            or `invalid credentials` (the user no longer exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password/set:
    post:
      tags: [Auth]
      operationId: setPassword
      summary: Set a password from an invite
      description: Used by invited tenants and property managers, with the token from their invite link. Each invite can be used once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password set and tenant logged in (`message` is `password set`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: '`invalid token` (invalid, expired or non-invite token, or the invited user no longer exists)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`password already set` (the invite was already used)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create a tenant and their lease
      description: |
        Owner or property manager of the property only. The unit must exist on the property and be vacant,
        and the property must not be archived. Creates the tenant (without a password)
        and an active lease, increments the property's occupied units and queues an invite email
        linking to `<WEB_APP_URL>/set-password?token=<inviteToken>`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created (`message` is `tenant created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'
        '400':
          description: '`invalid request` (validation), `lease end date must be after start date` or `minimum partial amount cannot exceed the lease''s expected rent`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`property not found` or `unit not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`email already taken`, `property is archived` or `unit already has an active lease`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Tenants]
      operationId: getTenants
      summary: List tenants
      description: Owner or property manager only. Lists tenants on properties the caller owns or manages, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          required: false
          description: Only tenants of this property (must be one the caller can access).
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of tenants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Tenant ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Tenants]
      operationId: getTenantInfo
      summary: Get a tenant
      description: The tenant themself, or the owner/manager of the tenant's property.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Tenants]
      operationId: updateTenantInfo
      summary: Update a tenant's profile
      description: The tenant themself, or the owner/manager of the tenant's property. Only fields sent are changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: The updated tenant (`message` is `tenant updated`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties:
    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create a property
      description: Owner only. Creates the property and any units in one transaction; `numberOfUnits` equals the number of units sent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created (`message` is `property created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          description: '`invalid request` (validation) or `duplicate unit number`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Properties]
      operationId: getProperties
      summary: List properties
      description: Owners get properties they own; managers get properties assigned to them. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of properties.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PropertyList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Property ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Properties]
      operationId: getPropertyInfo
      summary: Get a property
      description: Owner or assigned manager. Archived properties are returned too.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The property.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Properties]
      operationId: updatePropertyInfo
      summary: Update a property
      description: Owner only (the property's manager gets 403). Only fields sent are changed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: The updated property (`message` is `property updated`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: Property ID
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Properties]
      operationId: archiveProperty
      summary: Archive a property
      description: Owner only. Archived properties are hidden from lists by default and reject new units and tenants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The archived property (`message` is `property archived`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '409':
          description: '`property is already archived` or `property has active leases`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/{id}/manager:
    parameters:
      - name: id
        in: path
        required: true
        description: Property ID
        schema:
          type: integer
          minimum: 1
    put:
      tags: [Properties]
      operationId: assignPropertyManager
      summary: Assign a manager
      description: Owner only. The manager must belong to the caller. Replaces any current manager.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignManagerRequest'
      responses:
        '200':
          description: The updated property (`message` is `manager assigned`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`property not found` or `manager not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Properties]
      operationId: unassignPropertyManager
      summary: Unassign the manager
      description: Owner only. Succeeds even if no manager is assigned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated property with `managerId` null (`message` is `manager unassigned`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/{id}/units:
    parameters:
      - name: id
        in: path
        required: true
        description: Property ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Properties]
      operationId: getUnits
      summary: List units
      description: Owner or assigned manager. Ordered by `number`; not paginated.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The property's units.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Properties]
      operationId: createUnit
      summary: Add a unit
      description: Owner or assigned manager. Increments `numberOfUnits` in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitRequest'
      responses:
        '201':
          description: Unit created (`message` is `unit created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PropertyNotFound'
        '409':
          description: '`property is archived` or `unit number already exists`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/{id}/units/{unitId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Property ID
        schema:
          type: integer
          minimum: 1
      - name: unitId
        in: path
        required: true
        description: Unit ID
        schema:
          type: integer
          minimum: 1
    patch:
      tags: [Properties]
      operationId: updateUnit
      summary: Update a unit
      description: Owner or assigned manager. Only `floor` and `label` can change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnitRequest'
      responses:
        '200':
          description: The updated unit (`message` is `unit updated`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`property not found` or `unit not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Properties]
      operationId: deleteUnit
      summary: Delete a unit
      description: Owner or assigned manager. Only vacant units; decrements `numberOfUnits` in the same transaction.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unit deleted (`message` is `unit deleted`, `data` is null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`property not found` or `unit not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`unit is occupied`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /properties/managers:
    post:
      tags: [Managers]
      operationId: createPropertyManager
      summary: Create and invite a manager
      description: |
        Owner only. Creates an admin with role `property_manager` belonging to the caller, without a password,
        and queues an invite email linking to `<WEB_APP_URL>/set-password?token=<inviteToken>`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagerRequest'
      responses:
        '201':
          description: Manager created (`message` is `manager created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Manager'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`email already taken` (any admin)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Managers]
      operationId: getPropertyManagers
      summary: List managers
      description: Owner only. The caller's managers, newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of managers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ManagerList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

