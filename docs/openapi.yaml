        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /leases/installments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Installment ID
        schema:
          type: integer
          minimum: 1
    patch:
      tags: [Leases]
      operationId: updateInstallment
      summary: Change an installment's due date
      description: Owner or manager. Amounts change only through a new schedule.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstallmentRequest'
      responses:
        '200':
          description: The updated installment (`message` is `installment updated`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Installment'
