        description: Payment ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Payments]
      operationId: getPaymentInfo
      summary: Get a payment
      description: The payment's tenant, or the owner/manager of its property. Includes allocations and receipt.
      security:
        - bearerAuth: []
      responses:
        '200':
