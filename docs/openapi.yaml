    post:
      tags: [Payments]
      operationId: completeCheckout
      summary: Complete a checkout (development only)
      description: |
        Only registered when `APP_ENV=development`; no token required. Simulates the payment provider
        confirming the checkout and applies the payment.
      responses:
        '200':
          description: Checkout completed (`message` is `checkout completed`).
          content:
