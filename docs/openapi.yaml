  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Record an offline payment
      description: |
        Owner or manager of the lease's property. Records money received outside the app and applies it to the
        lease (or to `installmentIds` first). Partial-payment settings don't apply.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment recorded (`message` is `payment recorded`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentDetail'
        '400':
          description: '`invalid request`, `amount exceeds outstanding balance` or `invalid installment`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`lease not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`reference already exists`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Payments]
      operationId: getPayments
      summary: List payments
      description: Owners and managers see payments on their properties; tenants see only their own. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          required: false
          schema:
            type: integer
        - name: tenantId
          in: query
          required: false
          description: Ignored for tenants.
          schema:
            type: integer
        - name: leaseId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [unpaid, partially_paid, paid, failed, expired]
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [offline, checkout]
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            enum: [lease, installments, partial]
        - name: method
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: On or after this date (paidAt, or createdAt if unpaid).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: On or before this date.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /payments/{id}:
    parameters:
      - name: id
