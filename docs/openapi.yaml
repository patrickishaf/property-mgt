          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`payment is not a checkout`, `payment is not awaiting completion`, `checkout has expired` or `amount exceeds outstanding balance`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /leases:
    get:
      tags: [Leases]
      operationId: getLeases
      summary: List leases
      description: Owners and managers see leases on their properties; tenants see their own. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: query
          required: false
          schema:
            type: integer
        - name: tenantId
          in: query
          required: false
          description: Ignored for tenants.
          schema:
            type: integer
        - name: unitNumber
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, ended, terminated]
        - name: endingBefore
          in: query
          required: false
          description: Leases whose endDate is before this date.
          schema:
            type: string
            format: date
        - name: hasBalance
          in: query
          required: false
          description: true for rent still owed, false for fully paid.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of leases.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LeaseList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Leases]
      operationId: createLease
      summary: Create a lease for an existing tenant
      description: |
        Owner or manager. For a tenant with no active lease (renewal or move). Creates the lease, occupies the
        unit and points the tenant at the new lease in one transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaseForTenantRequest'
      responses:
        '201':
          description: Lease created (`message` is `lease created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LeaseDetail'
        '400':
          description: '`invalid request`, `lease end date must be after start date` or `minimum partial amount cannot exceed the leases expected rent`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`tenant not found`, `property not found` or `unit not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`property is archived`, `unit already has an active lease` or `tenant already has an active lease`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /leases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Lease ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Leases]
      operationId: getLeaseById
      summary: Get a lease
      description: The lease's tenant, or the owner/manager of its property.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The lease.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LeaseDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`lease not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Leases]
      operationId: updateLease
      summary: Update, end or terminate a lease
      description: |
        Owner or manager. Partial-payment settings can change in any status. endDate, expectedRent and status
        need an active lease. expectedRent is refused while installments are owed. Ending or terminating frees
        the unit; the balance stays owed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaseRequest'
      responses:
        '200':
          description: The updated lease (`message` is `lease updated`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LeaseDetail'
        '400':
          description: '`invalid request`, `lease end date must be after start date`, `expected rent cannot be less than the amount already paid (<n>)` or `minimum partial amount cannot exceed the leases expected rent`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`lease not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`lease is not active` or `lease has unpaid installments`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /leases/{id}/installments:
    parameters:
      - name: id
        in: path
        required: true
        description: Lease ID
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Leases]
      operationId: getLeaseInstallments
      summary: Get a lease's installment schedule
      description: The lease's tenant, or the owner/manager of its property. Due-date order; not paginated.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Installment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`lease not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Leases]
      operationId: createLeaseInstallment
      summary: Set a lease's installment schedule
      description: |
        Owner or manager; active leases only. Replaces installments that have received no money. The new items
        plus the outstanding amounts of kept installments must equal the lease's outstanding rent exactly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstallmentsRequest'
      responses:
        '201':
          description: The lease's full schedule (`message` is `installments set`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Installment'
        '400':
          description: '`invalid request` or `installments must add up to the leases outstanding rent of <n>`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`lease not found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`lease is not active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

