  /payments/checkout:
    post:
      tags: [Payments]
      operationId: initiateCheckout
      summary: Start a checkout
      description: |
        Tenant only. Pays the given `leaseId`, otherwise the tenant's active lease, otherwise their most recent
        lease with a balance. Creates an `unpaid` payment and returns the checkout URL.
        One open checkout per lease at a time. The provider is currently stubbed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateCheckoutRequest'
      responses:
        '201':
          description: Checkout created (`message` is `checkout created`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Payment'
        '400':
          description: '`invalid request`, `invalid installment`, `partial payments are not allowed for this lease`, `amount is below the minimum partial amount of <n>` or `amount exceeds outstanding balance`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`lease not found` (leaseId not the tenant''s) or `no lease with an outstanding balance`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`lease has no outstanding balance` or `a checkout is already in progress for this lease`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: '`payment provider unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

