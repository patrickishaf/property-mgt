root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app ./cmd/server"
  entrypoint = ["./tmp/app"]
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "bin", "docs", "vendor", ".git", ".claude", ".vscode"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[misc]
  clean_on_exit = true
